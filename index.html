  :root{
    --maroon:#7d1426;
    --maroon-deep:#6a0f1e;

    --green:#1f7a35;
    --green-deep:#155f27;
    --cream:#f8f3ed;
    --card:#fdfaf7;
    --gold:#b8945a;
    --gold-light:#d9bf8c;
    --text-maroon:#6e1424;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden}
  body{
    font-family:'Lato',system-ui,sans-serif;
    background:var(--cream);
    color:var(--text-maroon);
    min-height:100vh;
    min-height:100svh;
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;

  a{text-decoration:none;color:inherit}

  .page{
    width:100%;
    max-width:1024px;
    margin:0 auto;
    flex:1;
    display:flex;flex-direction:column;
    background:
      radial-gradient(ellipse at 50% 0%, #fbf8f4 0%, var(--cream) 60%);
  }

  /* ---------- Header ---------- */
  header{
    text-align:center;
    padding:clamp(8px,1.6vw,16px) 16px 0;
  }
  .logo{
    display:block;
    width:clamp(116px,19vw,194px);
    height:auto;
    margin:0 auto;
  }
  h1{
    font-family:'Cinzel','Trajan Pro',Georgia,serif;
    font-weight:700;
    color:var(--maroon);
    font-size:clamp(38px,7.6vw,78px);
    line-height:1.05;
    letter-spacing:.02em;
    margin-top:clamp(4px,1vw,10px);
  }
  .tagline{
    display:flex;align-items:center;justify-content:center;
    gap:clamp(10px,2.4vw,24px);
    margin-top:clamp(4px,.8vw,8px);
    font-size:clamp(15px,2.3vw,23px);
    letter-spacing:.06em;
    color:#4a3a36;
  }
  .tagline::before,.tagline::after{
    content:"";
    width:clamp(34px,7vw,70px);
    height:2px;
    background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold));
    border-radius:2px;
  }
  .tagline::after{transform:scaleX(-1)}

  /* ---------- Buttons ---------- */
  .links{
    position:relative;
    z-index:2;
    width:calc(100% - 64px);
    max-width:320px;
    margin:clamp(-30px,-3vw,-8px) auto 0;
    padding:4px 0 14px;
    flex:1;
    display:flex;flex-direction:column;
    justify-content:space-evenly;
    gap:10px;
  }

    z-index:-1;

  @media (max-width:640px){
    .logo{width:100px}
    h1{font-size:34px}
    header{padding-top:4px}
    .tagline{font-size:14px;letter-spacing:.03em;gap:8px;white-space:nowrap}
    .tagline::before,.tagline::after{width:24px}
  }
  .btn{
    display:flex;align-items:center;
    width:100%;
    min-height:34px;
    padding:4px 18px;
    border-radius:999px;
    font-family:'Nunito Sans','Lato',system-ui,sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.02em;
    background:var(--card);
    color:var(--text-maroon);
    border:1.5px solid var(--maroon);
    box-shadow:0 0 0 1.5px rgba(217,191,140,.5), 0 4px 10px rgba(90,12,24,.10);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    cursor:pointer;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1.5px rgba(217,191,140,.7),0 7px 16px rgba(90,12,24,.16)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .btn .ico{
    flex:0 0 20px;
    width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
    margin-right:12px;
  }
  .btn .ico svg{display:block;width:15px;height:15px}
  .btn .ico svg.wide{width:17px;height:17px}
  .btn .label{flex:1;line-height:1.2;padding-right:48px;white-space:nowrap}
  .btn .chev{flex:0 0 7px;width:7px;height:12px;margin-left:0;opacity:.9}

  .btn--maroon{
    background:linear-gradient(180deg,#8e1a2e 0%,var(--maroon) 55%,var(--maroon-deep) 100%);
    color:#fff;border-color:var(--gold-light);
    box-shadow:0 0 0 1px rgba(184,148,90,.6), 0 5px 12px rgba(90,12,24,.22);
  }
  .btn--green{
    background:linear-gradient(180deg,#2a8a40 0%,var(--green) 55%,var(--green-deep) 100%);
    color:#fff;border-color:var(--gold-light);
    box-shadow:0 0 0 1px rgba(184,148,90,.6), 0 5px 12px rgba(18,80,34,.22);
  }
  .btn--maroon:hover,.btn--green:hover{filter:brightness(1.06)}

  /* ---------- Footer band ---------- */
  .footer{
    --arc:clamp(110px,14vw,170px);
    position:relative;
    margin-top:calc(-1 * clamp(64px,9vw,110px));
    padding-top:calc(var(--arc) + 10px);
    background:linear-gradient(180deg,var(--maroon) 0%,var(--maroon-dark) 100%);
    text-align:center;
    overflow:hidden;
    z-index:1;
  }
  /* cream bowl with gold rim */
  .footer::before{
    content:"";
    position:absolute;
    left:50%;top:-2px;
    width:118%;
    height:var(--arc);
    transform:translateX(-50%);
    background:var(--cream);
    border:2px solid var(--gold-light);
    border-top:0;
    border-radius:0 0 50% 50% / 0 0 100% 100%;
  }
  .socials{
    position:relative;
    display:flex;justify-content:center;
    gap:clamp(14px,2vw,18px);
  }
  .social{
    position:relative;
    width:40px;height:40px;
    border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .15s ease;
  }
  /* invisible 48px tap area around the smaller tile */
  .social::after{content:"";position:absolute;inset:-4px}
  .social:hover{transform:translateY(-2px)}
  .social:focus-visible{outline:3px solid var(--gold-light);outline-offset:3px}
  .social svg{width:21px;height:21px;display:block}
  .social--ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
  .social--fb{background:linear-gradient(180deg,#2d8cff,#1466e0)}
  .social--wa{background:linear-gradient(180deg,#3fd96b,#18a843)}

  .domain{
    display:flex;align-items:center;justify-content:center;
    gap:clamp(14px,2.4vw,24px);
    padding:clamp(18px,2.4vw,24px) 16px calc(clamp(22px,3vw,30px) + env(safe-area-inset-bottom));
    color:#fff;
    font-weight:700;
    font-size:clamp(13px,1.6vw,15px);
    letter-spacing:.06em;
  }
  .domain::before,.domain::after{
    content:"";width:clamp(28px,4.6vw,46px);height:1px;background:rgba(243,230,217,.7);
  }
  .domain a:hover{text-decoration:underline;text-underline-offset:4px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
